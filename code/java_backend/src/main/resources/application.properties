server.port=${API_PORT:18001}
server.address=${API_HOST:127.0.0.1}
spring.datasource.url=jdbc:sqlite:${SCMS_JAVA_DB:scms-java.db}?foreign_keys=on&busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=always
scms.jwt-secret=${SCMS_JAVA_SECRET:}
scms.demo-password=${SCMS_JAVA_DEMO_PASSWORD:}
spring.main.banner-mode=off
